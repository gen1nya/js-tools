<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер HEX-DEC-BIN</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        input {
            font-family: 'Courier New', monospace;
            word-break: break-all;
            min-height: 50px;
        }

        .options {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        select {
            background: var(--bg-container);
        }

        .display-panel {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .binary-grouped {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .binary-byte {
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            font-size: 0.9em;
            cursor: help;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 80px;
        }

        .binary-byte:hover {
            background: rgba(102, 126, 234, 0.35);
            transform: translateY(-2px);
        }

        .info-panel {
            background: var(--gradient-primary);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            word-break: break-word;
        }

        .clear-btn {
            background: var(--color-error);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
        }

        .clear-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.4);
        }

        .utf8-panel {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid var(--color-success);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .utf8-error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--color-error);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .bigint-info {
            background: rgba(118, 75, 162, 0.15);
            border: 1px solid var(--color-secondary);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .options {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body class="body--gradient">
<div class="container">
    <h1>🔄 Конвертер HEX-DEC-BIN</h1>

    <div class="converter-grid">
        <div class="input-group">
            <label for="hexInput">Шестнадцатеричное (HEX):</label>
            <input type="text" id="hexInput" placeholder="Например: FF, 0xFF, DEADBEEF, очень длинные строки...">
        </div>

        <div class="input-group">
            <label for="decInput">Десятичное (DEC):</label>
            <input type="text" id="decInput" placeholder="Например: 255, -128, очень большие числа...">
        </div>

        <div class="input-group">
            <label for="binInput">Двоичное (BIN):</label>
            <input type="text" id="binInput" placeholder="Например: 11111111, 0b10101010, очень длинные строки...">
        </div>
    </div>

    <div class="options">
        <div class="option-group">
            <label>Порядок байтов:</label>
            <select id="byteOrder">
                <option value="big">Big Endian</option>
                <option value="little">Little Endian</option>
            </select>
        </div>

        <div class="option-group">
            <label>Интерпретация:</label>
            <select id="interpretation">
                <option value="unsigned">Unsigned</option>
                <option value="signed">Signed (Two's complement)</option>
            </select>
        </div>
    </div>

    <button class="clear-btn" onclick="clearAll()">🗑️ Очистить всё</button>

    <div class="display-panel" id="hexDisplay">
        <div>Шестнадцатеричное представление появится здесь</div>
    </div>

    <div class="display-panel" id="binaryDisplay">
        <div>Двоичное представление появится здесь</div>
    </div>

    <div class="display-panel" id="utf8Display">
        <div>UTF-8 интерпретация появится здесь</div>
    </div>

    <div class="info-panel">
        <h3>📊 Информация о представлении</h3>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Количество бит</div>
                <div class="info-value" id="bitCount">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Количество байт</div>
                <div class="info-value" id="byteCount">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Тип Java</div>
                <div class="info-value" id="javaType">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Диапазон значений</div>
                <div class="info-value" id="valueRange">-</div>
            </div>
        </div>
    </div>
</div>

<script src="../js/theme.js"></script>
<script src="../js/toolbar.js"></script>
<script>
    let isUpdating = false;

    const hexInput = document.getElementById('hexInput');
    const decInput = document.getElementById('decInput');
    const binInput = document.getElementById('binInput');
    const byteOrder = document.getElementById('byteOrder');
    const interpretation = document.getElementById('interpretation');

    // Event listeners
    hexInput.addEventListener('input', () => convertFrom('hex'));
    decInput.addEventListener('input', () => convertFrom('dec'));
    binInput.addEventListener('input', () => convertFrom('bin'));

    byteOrder.addEventListener('change', () => {
        if (hexInput.value.trim()) {
            convertFrom('hex');
        } else if (binInput.value.trim()) {
            convertFrom('bin');
        } else {
            updateDisplay();
        }
    });

    interpretation.addEventListener('change', () => {
        if (hexInput.value.trim()) {
            convertFrom('hex');
        } else if (binInput.value.trim()) {
            convertFrom('bin');
        } else {
            updateDisplay();
        }
    });

    function convertFrom(source) {
        if (isUpdating) return;
        isUpdating = true;

        try {
            let value = null;

            if (source === 'hex' && hexInput.value.trim()) {
                const hex = hexInput.value.trim().replace(/^0x/i, '');
                if (/^[0-9a-f]+$/i.test(hex)) {
                    value = parseHexWithEndianness(hex);
                }
            } else if (source === 'dec' && decInput.value.trim()) {
                const dec = decInput.value.trim();
                if (/^-?\d+$/.test(dec)) {
                    value = BigInt(dec);
                }
            } else if (source === 'bin' && binInput.value.trim()) {
                const bin = binInput.value.trim().replace(/^0b/i, '');
                if (/^[01]+$/.test(bin)) {
                    value = parseBinWithEndianness(bin);
                }
            }

            if (value !== null) {
                updateAllFields(value, source);
                updateDisplay();
            } else {
                clearInfo();
            }
        } catch (e) {
            clearInfo();
        }

        isUpdating = false;
    }

    function parseHexWithEndianness(hex) {
        if (hex.length % 2 !== 0) {
            hex = '0' + hex;
        }

        if (byteOrder.value === 'little') {
            const bytes = [];
            for (let i = 0; i < hex.length; i += 2) {
                bytes.push(hex.substr(i, 2));
            }
            hex = bytes.reverse().join('');
        }

        let value = BigInt('0x' + hex);

        if (interpretation.value === 'signed') {
            const bitCount = hex.length * 4;
            const maxSigned = BigInt(2) ** BigInt(bitCount - 1);
            const maxUnsigned = BigInt(2) ** BigInt(bitCount);

            if (value >= maxSigned) {
                value = value - maxUnsigned;
            }
        }

        return value;
    }

    function parseBinWithEndianness(bin) {
        const paddedLength = Math.ceil(bin.length / 8) * 8;
        bin = bin.padStart(paddedLength, '0');

        if (byteOrder.value === 'little') {
            const bytes = [];
            for (let i = 0; i < bin.length; i += 8) {
                bytes.push(bin.substr(i, 8));
            }
            bin = bytes.reverse().join('');
        }

        let value = BigInt('0b' + bin);

        if (interpretation.value === 'signed') {
            const bitCount = BigInt(bin.length);
            const maxSigned = BigInt(2) ** (bitCount - BigInt(1));
            const maxUnsigned = BigInt(2) ** bitCount;

            if (value >= maxSigned) {
                value = value - maxUnsigned;
            }
        }

        return value;
    }

    function updateAllFields(value, source) {
        if (source !== 'hex') {
            hexInput.value = formatHexWithEndianness(value);
        }
        if (source !== 'dec') {
            decInput.value = value.toString();
        }
        if (source !== 'bin') {
            binInput.value = formatBinWithEndianness(value);
        }
    }

    function formatHexWithEndianness(value) {
        let originalHex = '';
        if (hexInput.value.trim()) {
            originalHex = hexInput.value.trim().replace(/^0x/i, '');
            if (originalHex.length % 2 !== 0) {
                originalHex = '0' + originalHex;
            }
        }

        let hex;
        if (value < 0n) {
            // Определяем минимальное количество бит для представления
            const minBits = originalHex.length > 0 ? originalHex.length * 4 : 32;
            const bitCount = Math.max(minBits, 32);
            const maxUnsigned = BigInt(2) ** BigInt(bitCount);
            hex = (value + maxUnsigned).toString(16);
        } else {
            hex = value.toString(16);
        }

        hex = hex.toUpperCase();

        const targetLength = originalHex.length > 0 ? originalHex.length :
            (hex.length % 2 !== 0 ? hex.length + 1 : hex.length);
        hex = hex.padStart(targetLength, '0');

        if (byteOrder.value === 'little') {
            const bytes = [];
            for (let i = 0; i < hex.length; i += 2) {
                bytes.push(hex.substr(i, 2));
            }
            hex = bytes.reverse().join('');
        }

        return hex;
    }

    function formatBinWithEndianness(value) {
        let bin;
        if (value < 0n) {
            const bitCount = Math.max(8, Math.ceil(Math.log2(Number(value < 0n ? -value : value)) / 8) * 8);
            const maxUnsigned = BigInt(2) ** BigInt(bitCount);
            bin = (value + maxUnsigned).toString(2);
        } else {
            bin = value.toString(2);
        }

        const paddedLength = Math.ceil(bin.length / 8) * 8;
        bin = bin.padStart(paddedLength, '0');

        if (byteOrder.value === 'little') {
            const bytes = [];
            for (let i = 0; i < bin.length; i += 8) {
                bytes.push(bin.substr(i, 8));
            }
            bin = bytes.reverse().join('');
        }

        return bin;
    }

    function getCurrentValue() {
        if (decInput.value.trim()) {
            const dec = decInput.value.trim();
            if (/^-?\d+$/.test(dec)) {
                return BigInt(dec);
            }
        }
        return null;
    }

    function updateDisplay() {
        const value = getCurrentValue();
        if (value === null) return;

        updateHexDisplay();
        updateBinaryDisplay();
        updateUtf8Display();
        updateInfo(value);
    }

    function updateHexDisplay() {
        let hex = hexInput.value.trim().replace(/^0x/i, '');

        if (!hex) {
            document.getElementById('hexDisplay').innerHTML = '<div>Шестнадцатеричное представление появится здесь</div>';
            return;
        }

        if (hex.length % 2 !== 0) {
            hex = '0' + hex;
        }

        const bytes = [];
        for (let i = 0; i < hex.length; i += 2) {
            bytes.push(hex.substr(i, 2));
        }

        let displayBytes = [...bytes];
        if (byteOrder.value === 'little') {
            displayBytes.reverse();
        }

        const isBigNumber = hex.length > 16; // Больше 8 байт считаем большим числом

        document.getElementById('hexDisplay').innerHTML = `
            <div style="margin-bottom: 10px;">
                <strong>Шестнадцатеричное представление (${byteOrder.value === 'big' ? 'Big' : 'Little'} Endian):</strong>
                ${isBigNumber ? '<div class="bigint-info">⚡ Использование BigInt для больших чисел</div>' : ''}
            </div>
            <div class="binary-grouped">
                ${displayBytes.map((byte, index) => {
            const position = byteOrder.value === 'big' ? index : displayBytes.length - 1 - index;
            const decimal = parseInt(byte, 16);
            return `<span class="binary-byte" title="Байт ${position}: ${decimal} dec">${byte}</span>`;
        }).join('')}
            </div>
            <div style="margin-top: 15px; font-size: 0.9em; opacity: 0.8;">
                Порядок байтов: ${displayBytes.join(' ')}<br>
                ${byteOrder.value === 'big' ? 'Старший байт слева' : 'Младший байт слева'}<br>
                Общая длина: ${hex.length / 2} байт (${hex.length * 4} бит)
            </div>
        `;
    }

    function updateBinaryDisplay() {
        let binary = binInput.value.trim().replace(/^0b/i, '');

        if (!binary) {
            document.getElementById('binaryDisplay').innerHTML = '<div>Двоичное представление появится здесь</div>';
            return;
        }

        const paddedLength = Math.max(8, Math.ceil(binary.length / 8) * 8);
        binary = binary.padStart(paddedLength, '0');

        const bytes = [];
        for (let i = 0; i < binary.length; i += 8) {
            bytes.push(binary.substr(i, 8));
        }

        let displayBytes = [...bytes];
        if (byteOrder.value === 'little') {
            displayBytes.reverse();
        }

        const isBigNumber = binary.length > 64; // Больше 8 байт

        document.getElementById('binaryDisplay').innerHTML = `
            <div style="margin-bottom: 10px;">
                <strong>Двоичное представление (${byteOrder.value === 'big' ? 'Big' : 'Little'} Endian):</strong>
                ${isBigNumber ? '<div class="bigint-info">⚡ Использование BigInt для больших чисел</div>' : ''}
            </div>
            <div class="binary-grouped">
                ${displayBytes.map((byte, index) => {
            const position = byteOrder.value === 'big' ? index : displayBytes.length - 1 - index;
            return `<span class="binary-byte" title="Байт ${position}">${byte}</span>`;
        }).join('')}
            </div>
            <div style="margin-top: 15px; font-size: 0.9em; opacity: 0.8;">
                Порядок байтов: ${displayBytes.join(' ')}<br>
                ${byteOrder.value === 'big' ? 'Старший байт слева' : 'Младший байт слева'}<br>
                Общая длина: ${bytes.length} байт (${binary.length} бит)
            </div>
        `;
    }

    function updateUtf8Display() {
        const hex = hexInput.value.trim().replace(/^0x/i, '');

        if (!hex) {
            document.getElementById('utf8Display').innerHTML = '<div>UTF-8 интерпретация появится здесь</div>';
            return;
        }

        try {
            let paddedHex = hex.length % 2 !== 0 ? '0' + hex : hex;

            const bytes = [];
            for (let i = 0; i < paddedHex.length; i += 2) {
                bytes.push(parseInt(paddedHex.substr(i, 2), 16));
            }

            let utf8String = '';
            let validUtf8 = true;
            let byteInfo = [];

            try {
                const uint8Array = new Uint8Array(bytes);
                utf8String = new TextDecoder('utf-8', { fatal: true }).decode(uint8Array);

                for (let i = 0; i < bytes.length; i++) {
                    const byte = bytes[i];
                    const isPrintable = byte >= 32 && byte <= 126;
                    byteInfo.push({
                        hex: byte.toString(16).toUpperCase().padStart(2, '0'),
                        dec: byte,
                        char: isPrintable ? String.fromCharCode(byte) : '•'
                    });
                }
            } catch (e) {
                validUtf8 = false;

                for (let i = 0; i < bytes.length; i++) {
                    const byte = bytes[i];
                    const isPrintable = byte >= 32 && byte <= 126;
                    byteInfo.push({
                        hex: byte.toString(16).toUpperCase().padStart(2, '0'),
                        dec: byte,
                        char: isPrintable ? String.fromCharCode(byte) : '•'
                    });
                }
            }

            const isBigData = bytes.length > 32; // Больше 32 байт считаем большими данными

            document.getElementById('utf8Display').innerHTML = `
                <div style="margin-bottom: 10px;">
                    <strong>UTF-8 интерпретация:</strong>
                    ${isBigData ? '<div class="bigint-info">📚 Большой объем данных - показаны первые и последние байты</div>' : ''}
                </div>
                ${validUtf8 ? `
                    <div class="utf8-panel">
                        <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px; font-family: 'Segoe UI', sans-serif;">
                            "${utf8String.length > 100 ? utf8String.substring(0, 100) + '...' : utf8String}"
                        </div>
                        <div style="font-size: 0.9em; opacity: 0.8;">
                            Валидная UTF-8 строка (${utf8String.length} символов)
                        </div>
                    </div>
                ` : `
                    <div class="utf8-error">
                        <div style="font-size: 1em; font-weight: bold; margin-bottom: 5px;">
                            Невалидная UTF-8 последовательность
                        </div>
                        <div style="font-size: 0.9em; opacity: 0.8;">
                            Показаны отдельные байты как ASCII
                        </div>
                    </div>
                `}
                <div class="binary-grouped">
                    ${(isBigData ? byteInfo.slice(0, 16).concat([{hex: '...', dec: '...', char: '...'}], byteInfo.slice(-8)) : byteInfo).map(info => `
                        <span class="binary-byte" title="HEX: ${info.hex}, DEC: ${info.dec}, ASCII: ${info.char}">
                            ${info.hex}<br>
                            <span style="font-size: 0.8em; opacity: 0.7;">'${info.char}'</span>
                        </span>
                    `).join('')}
                </div>
                <div style="margin-top: 15px; font-size: 0.9em; opacity: 0.8;">
                    Каждый блок: HEX байт / ASCII символ<br>
                    • = непечатаемый символ
                    ${isBigData ? '<br>... = пропущенные байты для экономии места' : ''}
                </div>
            `;
        } catch (e) {
            document.getElementById('utf8Display').innerHTML = `
                <div class="utf8-error">
                    <strong>Ошибка при декодировании:</strong> ${e.message}
                </div>
            `;
        }
    }

    function updateInfo(value) {
        const isSigned = interpretation.value === 'signed';
        let binary;

        if (isSigned && value < 0n) {
            // Для отрицательных чисел нужно вычислить дополнение до двух
            const bitLength = hexInput.value.trim() ? (hexInput.value.trim().replace(/^0x/i, '').length * 4) : 
                              binInput.value.trim() ? binInput.value.trim().replace(/^0b/i, '').length : 32;
            const maxUnsigned = BigInt(2) ** BigInt(bitLength);
            binary = (value + maxUnsigned).toString(2);
        } else {
            binary = value < 0n ? (-value).toString(2) : value.toString(2);
        }

        const bitCount = Math.max(8, Math.ceil(binary.length / 8) * 8);
        const byteCount = bitCount / 8;

        document.getElementById('bitCount').textContent = bitCount.toString();
        document.getElementById('byteCount').textContent = byteCount.toString();

        // Определение Java типа с поддержкой BigInteger
        let javaType = 'BigInteger';
        let range = 'Неограниченный (любые числа)';

        // Проверяем, помещается ли в стандартные типы Java
        if (byteCount <= 8) {
            if (isSigned) {
                if (value >= -128n && value <= 127n && bitCount <= 8) {
                    javaType = 'byte';
                    range = '-128 .. 127';
                } else if (value >= -32768n && value <= 32767n && bitCount <= 16) {
                    javaType = 'short';
                    range = '-32,768 .. 32,767';
                } else if (value >= -2147483648n && value <= 2147483647n && bitCount <= 32) {
                    javaType = 'int';
                    range = '-2,147,483,648 .. 2,147,483,647';
                } else if (value >= -9223372036854775808n && value <= 9223372036854775807n && bitCount <= 64) {
                    javaType = 'long';
                    range = '-9,223,372,036,854,775,808 .. 9,223,372,036,854,775,807';
                }
            } else {
                if (value <= 255n && bitCount <= 8) {
                    javaType = 'byte (unsigned)';
                    range = '0 .. 255';
                } else if (value <= 65535n && bitCount <= 16) {
                    javaType = 'short (unsigned)';
                    range = '0 .. 65,535';
                } else if (value <= 4294967295n && bitCount <= 32) {
                    javaType = 'int (unsigned)';
                    range = '0 .. 4,294,967,295';
                } else if (value <= 18446744073709551615n && bitCount <= 64) {
                    javaType = 'long (unsigned)';
                    range = '0 .. 18,446,744,073,709,551,615';
                }
            }
        }

        document.getElementById('javaType').textContent = javaType;
        document.getElementById('valueRange').textContent = range;
    }

    function clearInfo() {
        document.getElementById('bitCount').textContent = '-';
        document.getElementById('byteCount').textContent = '-';
        document.getElementById('javaType').textContent = '-';
        document.getElementById('valueRange').textContent = '-';
        document.getElementById('hexDisplay').innerHTML = '<div>Шестнадцатеричное представление появится здесь</div>';
        document.getElementById('binaryDisplay').innerHTML = '<div>Двоичное представление появится здесь</div>';
        document.getElementById('utf8Display').innerHTML = '<div>UTF-8 интерпретация появится здесь</div>';
    }

    function clearAll() {
        hexInput.value = '';
        decInput.value = '';
        binInput.value = '';
        clearInfo();
    }
</script>
</body>
</html>
