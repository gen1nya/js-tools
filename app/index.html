<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        svg.background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 2.2em; font-weight: bold; color: var(--text-primary); margin-bottom: 10px; transition: color var(--transition-fast); }
        .subtitle { font-size: 1.1em; color: var(--text-muted); margin-bottom: 20px; transition: color var(--transition-fast); }
        .language-switch { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
        .lang-btn { background: none; border: 1px solid var(--border-color); padding: 5px 15px; margin: 0 5px; border-radius: 20px; cursor: pointer; font-size: 0.9em; transition: all var(--transition-fast); color: var(--text-primary); }
        .lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .lang-btn:hover:not(.active) { background: rgba(52, 152, 219, 0.1); }
        [data-theme="dark"] .lang-btn:hover:not(.active) { background: rgba(96, 165, 250, 0.15); }
        .description { font-size: 1em; color: var(--text-secondary); margin-bottom: 40px; text-align: left; transition: color var(--transition-fast); }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .tool-card-pair { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .tool-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; background: var(--bg-card); cursor: pointer; transition: all var(--transition-fast); text-decoration: none; color: inherit; }
        .tool-card:hover { border-color: var(--accent); background: white; box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1); transform: translateY(-2px); }
        [data-theme="dark"] .tool-card:hover { background: #0f172a; box-shadow: 0 4px 12px rgba(96, 165, 250, 0.15); }
        .tool-card--compact { padding: 16px; }
        .tool-card--dark { background: #0f172a; color: #e5e7eb; border-color: #111827; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); }
        .tool-card--dark:hover { background: #0b1221; border-color: #1f2937; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); transform: translateY(-2px); }
        .tool-card--dark .tool-title { color: #f8fafc; }
        .tool-card--dark .tool-desc { color: #cbd5e1; }
        [data-theme="dark"] .tool-card--dark {
            border-color: #3f2a6d;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #0c1120 0%, #0f1528 70%);
        }
        [data-theme="dark"] .tool-card--dark:hover {
            background: linear-gradient(135deg, #11172b 0%, #171f38 70%);
            border-color: #5b369d;
            box-shadow: 0 0 0 1px rgba(91, 54, 157, 0.3), 0 14px 30px rgba(0, 0, 0, 0.55);
        }
        .tool-icon { font-size: 2em; margin-bottom: 15px; display: block; }
        .tool-title { font-size: 1.2em; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); transition: color var(--transition-fast); }
        .tool-desc { font-size: 0.9em; color: var(--text-muted); line-height: 1.4; transition: color var(--transition-fast); }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.8em; color: var(--text-muted); text-align: center; transition: color var(--transition-fast), border-color var(--transition-fast); }
        .container { max-width: 800px; border-radius: 8px; position: relative; }
        @media (max-width: 768px) {
            .title { font-size: 1.8em; }
            .subtitle { font-size: 1em; }
            .tools-grid { grid-template-columns: 1fr; gap: 15px; }
            .tool-card { padding: 15px; }
            .tool-card-pair { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .title { font-size: 1.5em; }
            .lang-btn { padding: 8px 12px; margin: 2px; }
        }
    </style>
</head>
<body class="body--flat" style="padding-top: 20px;">
<svg class="background" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <line x1="0" y1="20%" x2="100%" y2="0" stroke="#3498db" stroke-width="2" opacity="0.2"/>
    <line x1="0" y1="80%" x2="100%" y2="100%" stroke="#e74c3c" stroke-width="2" opacity="0.2"/>
    <circle cx="80%" cy="30%" r="150" stroke="#2ecc71" stroke-width="2" fill="none" opacity="0.15"/>
    <circle cx="20%" cy="70%" r="100" stroke="#9b59b6" stroke-width="2" fill="none" opacity="0.15"/>
</svg>

<div class="container">
    <div class="header">
        <h1 class="title" data-text="title">Веб до того, как он стал ебаным</h1>
        <p class="subtitle" data-text="subtitle">Простые инструменты без всякой хуйни</p>
        <div class="language-switch">
            <button class="lang-btn" data-lang="ru">🇷🇺 Русский</button>
            <button class="lang-btn" data-lang="en">🇺🇸 English</button>
            <button class="lang-btn" data-lang="el">🇬🇷 Ελληνικά</button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                <span class="theme-toggle-slider" id="theme-toggle-slider">🌞</span>
            </button>
        </div>
    </div>

    <div class="description" data-text="description"></div>
    <div class="tools-grid" id="tools-grid"></div>
    <div class="footer" data-text="footer"></div>
</div>

<script src="js/theme.js"></script>

                <p>Здесь просто набор инструментов, которые конкретно мне сделали жизнь проще, но возможно подойдут и вам.</p>

                { name: "json_validator", icon: "🗄️", title: "Json-бьютификатор", desc: "Форматирует/валидирует JSON" },

                { name: "colors", icon: "🎨", title: "Цвета", desc: "Палитры, коды, всё для работы с цветом" },
                { name: "twitch_iframe", icon: "📺", title: "Айфрейм твича", desc: "Фиолетовый шакал скачать обои" },
                { name: "qr_generator_reader", icon: "📱", title: "QR коды", desc: "Генерит и читает QR коды" },
                { name: "audio_converter", icon: "🎵", title: "Аудио конвертер", desc: "Конвертирует аудио файлы в разные форматы и битрейты" },
                { name: "hex-dec-converter", icon: "🔢", title: "Hex-Dec конвертер", desc: "Конвертирует числа между шестнадцатеричным и десятичным форматами" },
                { name: "base-utf-converter", icon: "🔤", title: "Base64/58 конвертер", desc: "Конвертирует в Base64/58 и обратно" },
                { name: "litematic-converter", icon: "🧱", title: "Litematic → Schematic", desc: "Конвертирует .litematic в .schem" },
                { name: "webgl", icon: "👾", title: "WebGL шейдер", desc: "Переписаный c AGSL на WEBGL шейдер стекла" },
            ]
        },
        en: {
            title: "Web before it became fucked up",
            subtitle: "Simple tools without any bullshit",
            description: `
                <p>This page doesn't use cookies, doesn't collect analytics, and doesn't show ads. It doesn't know who you are or where you came from.</p>
                <p>Here's just a set of tools that made my life easier, but might work for you too.</p>
                <p>Not everything translated to English yet, but I'm working on it, and PRs are welcome.</p>
            `,
            footer: "Made on my knee with the help of Claude and ChatGPT.  <a href=\"https://github.com/gen1nya/js-tools\">Source code</a>",
            tools: [
                { name: "peko", icon: "🐰", title: "Peko", desc: "peko peko peko peko peko peko peko peko peko peko peko peko peko peko peko peko" },

                { name: "json_validator", icon: "🗄️", title: "Json-Beautifier", desc: "Formats/validates JSON" },
                { name: "image-converter", icon: "🖼️", title: "Image Converter", desc: "Converts images to different formats and sizes" },
                { name: "btc_generator", icon: "💰", title: "Dropbox", desc: "One-time BTC addresses" },
                { name: "ebatel_wallet", icon: "🖤", title: "BTC wallet", desc: "Non-custodial", url: "https://wallet.rus.ebatel.online/", variant: "dark" },
                { name: "colors", icon: "🎨", title: "Colors", desc: "Palettes, codes, everything for working with color" },
                { name: "twitch_iframe", icon: "📺", title: "Twitch Iframe", desc: "Purple jackal download wallpapers" },
                { name: "qr_generator_reader", icon: "📱", title: "QR Codes", desc: "Generates and reads QR codes" },
                { name: "audio_converter", icon: "🎵", title: "Audio Converter", desc: "Converts audio files to different formats and bitrates" },
                { name: "hex-dec-converter", icon: "🔢", title: "Hex-Dec Converter", desc: "Converts numbers between hexadecimal and decimal formats" },
                { name: "base-utf-converter", icon: "🔤", title: "Base64/58 Converter", desc: "Converts to Base64/58 and back" },
                { name: "litematic-converter", icon: "🧱", title: "Litematic → Schematic", desc: "Converts .litematic to .schem" },
                { name: "webgl", icon: "👾", title: "WebGL shader", desc: "Rewritten from AGSL to the WEBGL glass shader" }
            ]
        },
        el: {
            title: "Ο Ιστός πριν γίνει σκατά",
            subtitle: "Απλά εργαλεία χωρίς μαλακίες",
            description: `
                <p>Αυτή η σελίδα δεν χρησιμοποιεί cookies, δεν συλλέγει αναλύσεις και δεν εμφανίζει διαφημίσεις.</p>
                <p>Είναι απλά ένα σύνολο εργαλείων που έκαναν τη ζωή μου ευκολότερη και ίσως βοηθήσουν και εσάς.</p>
            `,
            footer: "Φτιαγμένο πρόχειρα με τη βοήθεια του Claude και του ChatGPT. <a href=\"https://github.com/gen1nya/js-tools\">Πηγαίος κώδικας</a>",
            tools: [
                { name: "peko", icon: "🐰", title: "Πέκο", desc: "πέκο πέκο πέκο..." },
                { name: "sorting_game", icon: "🎮", title: "Παιχνίδι από τη διαφήμιση", desc: "Μετακίνησε τους κρίκους από ένα στύλο σε έναν άλλο", url: "https://game.rus.ebatel.online/" },
                { name: "json_validator", icon: "🗄️", title: "Διαμορφωτής JSON", desc: "Μορφοποιεί/επικυρώνει JSON" },
                { name: "image-converter", icon: "🖼️", title: "Μετατροπέας εικόνων", desc: "Μετατρέπει εικόνες σε διαφορετικές μορφές και μεγέθη" },
                { name: "btc_generator", icon: "💰", title: "Dropbox", desc: "One-time BTC διευθύνσεις" },
                { name: "ebatel_wallet", icon: "🖤", title: "Πορτοφόλι BTC", desc: "Non-custodial", url: "https://wallet.rus.ebatel.online/", variant: "dark" },
                { name: "colors", icon: "🎨", title: "Χρώματα", desc: "Παλέτες, κωδικοί, όλα για εργασία με το χρώμα" },
                { name: "twitch_iframe", icon: "📺", title: "Iframe Twitch", desc: "Μωβ τσακάλι λήψη ταπετσαριών" },
                { name: "qr_generator_reader", icon: "📱", title: "QR κώδικες", desc: "Δημιουργεί και διαβάζει κωδικούς QR" },
                { name: "audio_converter", icon: "🎵", title: "Μετατροπέας ήχου", desc: "Μετατρέπει αρχεία ήχου σε διαφορετικές μορφές και bitrates" },
                { name: "hex-dec-converter", icon: "🔢", title: "Μετατροπέας Hex-Dec", desc: "Μετατρέπει αριθμούς μεταξύ δεκαεξαδικού και δεκαδικού" },
                { name: "base-utf-converter", icon: "🔤", title: "Μετατροπέας Base64/58", desc: "Μετατρέπει σε Base64/58 και πίσω" },
                { name: "litematic-converter", icon: "🧱", title: "Litematic → Schematic", desc: "Μετατρέπει .litematic σε .schem" },
                { name: "webgl", icon: "👾", title: "WebGL шейдер", desc: "Ξαναγράφηκε από AGSL στο WEBGL glass shader" }
            ]
        }
    };

    let currentLang = localStorage.getItem('lang') || 'ru';

    function switchLanguage(lang, targetBtn = null) {
        if (!translations[lang]) lang = 'ru';
        currentLang = lang;
        localStorage.setItem('lang', lang);

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if (targetBtn) targetBtn.classList.add('active');

        const texts = translations[lang];
        if (!texts) return;

        document.querySelectorAll('[data-text]').forEach(el => {
            const key = el.getAttribute('data-text');
            if (key in texts) el.innerHTML = texts[key];
        });

        renderTools(texts.tools || []);
        document.documentElement.lang = lang;
    }

    function renderCard(tool, { compact = false } = {}) {
        const isExternal = /^https?:\/\//.test(tool.url || '');
        const href = isExternal ? tool.url : `tools/${tool.name}.html`;
        const target = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
        const classes = ['tool-card'];
        if (compact) classes.push('tool-card--compact');
        if (tool.variant === 'dark') classes.push('tool-card--dark');

        return `
            <a href="${href}" class="${classes.join(' ')}"${target}>
                <span class="tool-icon">${tool.icon}</span>
                <div class="tool-title">${tool.title}</div>
                <div class="tool-desc">${tool.desc}</div>
            </a>
        `;
    }

    function renderTools(tools) {
        const grid = document.getElementById('tools-grid');
        let html = '';

        for (let i = 0; i < (tools || []).length; i++) {
            const tool = tools[i];
            const nextTool = tools[i + 1];

            if (tool?.name === 'btc_generator' && nextTool?.name === 'ebatel_wallet') {
                html += `
                    <div class="tool-card-pair">
                        ${renderCard(tool, { compact: true })}
                        ${renderCard(nextTool, { compact: true })}
                    </div>
                `;
                i++; // skip partner card, already rendered
                continue;
            }

            html += renderCard(tool);
        }

        grid.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', e => switchLanguage(btn.dataset.lang, e.currentTarget));
        });
        const initialBtn = document.querySelector(`.lang-btn[data-lang="${currentLang}"]`) || document.querySelector('.lang-btn');
        switchLanguage(currentLang, initialBtn);
    });
</script>
</body>
</html>
